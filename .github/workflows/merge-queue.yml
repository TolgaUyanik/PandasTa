# Merge queue for `dev`, built from auto-merge + this workflow.
#
# GitHub's native merge queue is not available on this repository, and branch protection on
# `dev` is strict (a PR must be up to date with `dev` before it merges). Without help, every
# merge leaves the other green PRs behind, and someone has to update each one and wait for a
# second CI run before merging it.
#
# How to queue a PR: `gh pr merge <N> --auto --merge` (or "Enable auto-merge" in the web UI).
# PRs into dev that the repository owner opens (the owner's and the issue-solver's) are queued
# by themselves when they open (auto-queue.yml); open one as a draft, or switch auto-merge off
# afterwards, to keep it out. Contributors' PRs are queued by hand.
# The queue is worked in the order auto-merge was switched on. The order is soft: a PR that is
# already up to date and green merges the moment it is queued, ahead of the line.
#
# What a queue step does for the queued PR at the head of the line (only the required `tests`
# check counts; other checks are ignored):
#   - draft, or green but blocked by something CI cannot fix (a review) -> skip to the next PR;
#   - conflicts with dev, or `tests` failed -> switch auto-merge off with a comment, next PR;
#   - behind `dev`  -> update its branch from `dev` (this workflow only; see below);
#   - up to date, no `tests` yet -> wait for its CI; take it out if CI waits for approval, ended
#     without a `tests` check, or does not start within 3 minutes (polled inside the step);
#   - otherwise     -> nothing: its CI is running, or GitHub is about to merge it.
#
# The logic is .github/scripts/merge-queue.sh. Two places run it, each in its own concurrency
# group (so a token-less ci.yml step can never cancel a pending step of this workflow):
#   - this workflow, on a push to `dev` (a PR merged) and on workflow_dispatch with `--ref dev`;
#   - ci.yml's `queue` job, when a PR's CI finishes. It has no owner token: it takes red PRs out,
#     and when the next PR is behind it dispatches this workflow to update it.
# Either one also dispatches this workflow when, after its once-per-step CI poll, a later PR
# still has no CI run (a fresh step polls for it).
# auto-merge-guard.yml dispatches this workflow when a PR into dev is queued. Dispatching with
# GITHUB_TOKEN starts a run (GitHub's one exception), and works without the file on the default
# branch: measured for ci.yml (dispatched on 2026-10-31 while `main` had no workflows), expected
# for this file.
# (Not pull_request_target: per GitHub's current rule it reads the workflow from `main`, which has
# none; measured, no pull_request_target run has ever happened here.) A drop re-checks the PR's
# head first and skips if it moved.
#
# Branch updates use the owner's fine-grained token (Contents, Pull requests, Workflows: read and
# write), stored as the secret MERGE_QUEUE_TOKEN of the `merge-queue` environment, which only the
# `dev` branch may use: a PR's own workflows cannot read it. Not enforced: `dev` takes no direct
# pushes (admins included) but requires no approving review, so anyone with write access can merge
# a PR that changes this file or the script and so reach the token. Merge changes under .github/
# only after reading them. Measured on #226: an update made with
# GITHUB_TOKEN started a pull_request run that waited for approval, and the PR stayed blocked
# although a ci.yml run dispatched on the branch passed `tests`. Expected, from GitHub's rules and
# not yet measured here: an update made with the owner's token starts pull_request CI like a push.
# If the token is rejected (expired, revoked, missing a permission), the step fails red and
# leaves every PR queued: renew the token and the environment secret. Of failed updates, only a 422
# takes the PR out, and only when it conflicts (DIRTY or CONFLICTING within 60 s); a 422 on a PR
# that still reads behind without a conflict fails the step red. An accepted update whose head
# does not move within 60 s also takes the PR out.
#
# One PR is tested at a time: slower than a native queue, but it never merges an untested tree.
name: Merge queue

on:
  push:
    branches: [dev]
  # From ci.yml's and auto-merge-guard.yml's `queue` jobs, from auto-queue.yml (with `enqueue`),
  # from itself (after its one CI poll per step), or by hand:
  # `gh workflow run merge-queue.yml --ref dev`. Only `--ref dev` passes the environment.
  workflow_dispatch:
    inputs:
      enqueue:
        description: "PR number to auto-queue (checked: opened by the repo owner, into dev, not a fork or draft)"
        required: false
        default: ""
        type: string

permissions:
  contents: read         # gh pr merge --disable-auto reads the PR's commits
  pull-requests: write   # switch auto-merge off, comment
  actions: write         # gh run list; re-dispatch itself after a once-per-step poll

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment holds MERGE_QUEUE_TOKEN and admits only runs on `dev` (a push to dev, or a
    # dispatch with --ref dev); a PR branch never qualifies.
    environment: merge-queue
    concurrency:
      group: merge-queue
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # dev's copy of the script, whatever ref was dispatched.
      - uses: actions/checkout@v4
        with:
          ref: dev
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move the merge queue on
        # The owner's token only in this step, not in checkout's environment.
        env:
          MQ_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          MQ_REQUIRED: "1"
          MQ_ENQUEUE: ${{ inputs.enqueue }}
        run: bash .github/scripts/merge-queue.sh
