# Merge queue for `dev`, built from auto-merge + this workflow.
#
# GitHub's native merge queue is not available on this repository, and branch protection on
# `dev` is strict (a PR must be up to date with `dev` before it merges). Without help, every
# merge leaves the other green PRs behind, and someone has to update each one and wait for a
# second CI run before merging it.
#
# How to queue a PR: `gh pr merge <N> --auto --merge` (or "Enable auto-merge" in the web UI).
# The queue is worked in the order auto-merge was switched on. The order is soft: a PR that is
# already up to date and green merges the moment it is queued, ahead of the line.
#
# What this workflow does, every time it runs, for the queued PR at the head of the line
# (only the required `tests` check counts; other checks are ignored):
#   - draft, or green but blocked by something CI cannot fix (a review) -> skip to the next PR;
#   - conflicts with dev, or `tests` failed -> switch auto-merge off with a comment, next PR;
#   - behind `dev`  -> update its branch from `dev` (see below); its pull_request CI follows;
#   - up to date, CI ended with no `tests` check -> switch auto-merge off with a comment;
#   - otherwise     -> nothing: its CI is running, or GitHub is about to merge it.
#
# The logic is .github/scripts/merge-queue.sh. Three places run it: this workflow on a push to
# `dev` (a PR merged), ci.yml's `queue` job when a PR's CI finishes, and auto-merge-guard.yml's
# `queue` job when a PR into dev is queued. The jobs share one concurrency group, so one step
# runs at a time. (Not via workflow_dispatch of this file: that fires only for workflow files
# on the default branch, `main`, which gets this file only at a release.)
#
# Branch updates use the owner's token (secret MERGE_QUEUE_TOKEN: a fine-grained token for this
# repository with Contents, Pull requests and Workflows read/write), not GITHUB_TOKEN. Measured
# on #226: an update made with GITHUB_TOKEN started a pull_request run that waited for approval,
# and the PR stayed blocked although a ci.yml run dispatched on the branch passed `tests`. An update made with the owner's token starts normal
# pull_request CI, like a push. Everything else (comments, auto-merge off) uses GITHUB_TOKEN.
# When the token expires, updates fail and each PR is taken out of the queue with a comment:
# renew the token and the secret.
#
# One PR is tested at a time: slower than a native queue, but it never merges an untested tree.
name: Merge queue

on:
  push:
    branches: [dev]
  # Manual retry from the Actions tab; works once this file is on main (see above).
  workflow_dispatch:

permissions:
  contents: write        # update a PR branch from dev
  pull-requests: write   # switch auto-merge off, comment

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One concurrency group across merge-queue.yml, ci.yml and auto-merge-guard.yml.
    concurrency:
      group: merge-queue
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MQ_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Move the merge queue on
        run: bash .github/scripts/merge-queue.sh
