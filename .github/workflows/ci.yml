# Runs the full pytest suite, which includes the Gate E ledger check
# (tests/test_gate_e_ledger.py). Gate E itself needs the private Backtesting
# engine and BIST data, so it runs locally and is recorded in docs/gate_e_ledger.csv.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # Manual run from the Actions tab or `gh workflow run ci.yml --ref <branch>`. It did not
  # unblock a PR on #226 (blocked with this run's `tests` passing): approve or re-run the PR's
  # own pull_request run instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Direct dependencies pinned to the local measuring env (2026-10-28); transitive ones
      # (python-dateutil, tzdata, ...) float, so CI is close to that env, not identical.
      # setuptools < 81: pandas_ta/__init__.py still imports pkg_resources.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" "pandas==2.3.3" "numpy==1.26.4" "scipy==1.13.0" \
                      "TA-Lib==0.7.1" "pytest==8.4.1"
          pip install -e .
      # Two tests deselected by name, so any other failure still fails the job:
      # - test_audited_rows_carry_their_evidence: the one CLAUDE.md "Known break" (#8), fails on every clone.
      # - test_regenerating_reproduces_the_committed_rows: not a known break; it needs the sibling
      #   checkout ../AlternativeRepos/pandas-ta-classic, which CI does not have.
      - name: Test
        run: >
          python -m pytest -q
          --deselect tests/test_pine_coverage_csv.py::test_audited_rows_carry_their_evidence
          --deselect tests/test_altrepo_talib_csv.py::test_regenerating_reproduces_the_committed_rows

  # Moves the merge queue on (merge-queue.yml) once a PR's CI has finished, pass or fail: takes
  # a red PR out, or waits. It has no owner token (PR workflows must never see it): when the
  # next PR is behind dev, or a later PR still has no CI run, it dispatches merge-queue.yml.
  # A push to dev runs the queue by itself.
  queue:
    needs: tests
    if: >-
      always() && github.event_name != 'push' && github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own group: it must never cancel a pending merge-queue.yml step, the only one that
    # can update branches.
    concurrency:
      group: merge-queue-ci
      cancel-in-progress: false
    permissions:
      contents: read         # gh pr merge --disable-auto reads the PR's commits
      pull-requests: write   # switch auto-merge off, comment
      actions: write         # gh run list; dispatch merge-queue.yml
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # dev's copy of the queue logic, never the PR's: a PR cannot change how the queue treats
      # the other PRs before it is reviewed and merged.
      - uses: actions/checkout@v4
        with:
          ref: dev
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move the merge queue on
        run: |
          if [ ! -f .github/scripts/merge-queue.sh ]; then echo "the merge queue is not on dev yet"; exit 0; fi
          bash .github/scripts/merge-queue.sh
