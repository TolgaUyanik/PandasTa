# Runs the full pytest suite, which includes the Gate E ledger check
# (tests/test_gate_e_ledger.py). Gate E itself needs the private Backtesting
# engine and BIST data, so it runs locally and is recorded in docs/gate_e_ledger.csv.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to the environment Gate E and the local suite were measured on (2026-10-28).
      # setuptools < 81: pandas_ta/__init__.py still imports pkg_resources.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" "pandas==2.3.3" "numpy==1.26.4" "scipy==1.13.0" \
                      "TA-Lib==0.7.1" "pytest==8.4.1"
          pip install -e .
      # Two known breaks, deselected by name so any other failure still fails the job:
      # - test_audited_rows_carry_their_evidence: CLAUDE.md "Known breaks" (#8), fails on every clone.
      # - test_regenerating_reproduces_the_committed_rows: needs ../AlternativeRepos/pandas-ta-classic.
      - name: Test
        run: >
          python -m pytest -q
          --deselect tests/test_pine_coverage_csv.py::test_audited_rows_carry_their_evidence
          --deselect tests/test_altrepo_talib_csv.py::test_regenerating_reproduces_the_committed_rows
