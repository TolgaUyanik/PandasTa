# Queues a PR into `dev` by itself when the repository owner opens it: the owner's own PRs and
# the issue-solver's, which it opens as the owner. Contributors' PRs are not touched; the owner
# reviews and queues them by hand (`gh pr merge <N> --auto --merge`).
#
# This job only asks: it dispatches merge-queue.yml on `dev` with the PR number, and that run's
# `enqueue` job, which holds the owner's token in its `dev`-only environment, checks the PR again
# (author, base, not a fork, not a draft, open, not queued yet, no .github/ change, no commits by
# others) and switches auto-merge on with the owner's token. On opening, reopening and leaving
# draft only: switching auto-merge off later holds until one of those (or a manual dispatch with
# `enqueue`). To keep a PR out of the queue, open it as a draft.
# Until merge-queue.yml on `dev` has the `enqueue` input, this dispatch fails (HTTP 422) with a
# warning, and PRs opened before then are queued by hand. A PR that is already green and up to
# date when it reopens or leaves draft merges at once.
name: Auto-queue

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [dev]

permissions:
  actions: write   # dispatch merge-queue.yml

jobs:
  enqueue:
    if: >-
      github.event.pull_request.user.login == github.repository_owner
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Ask the merge queue to queue this PR
        run: |
          gh workflow run merge-queue.yml --repo "$GITHUB_REPOSITORY" --ref dev -f enqueue="$PR" \
            || echo "::warning::merge-queue.yml on dev did not accept the enqueue request; queue #$PR by hand"
