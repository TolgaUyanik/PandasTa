# Queues a PR into `dev` by itself when the repository owner opens it: the owner's own PRs and
# the issue-solver's, which it opens as the owner. Contributors' PRs are not touched; the owner
# reviews and queues them by hand (`gh pr merge <N> --auto --merge`).
#
# This job only asks: it dispatches merge-queue.yml on `dev` with the PR number, and that run,
# which holds the owner's token in its `dev`-only environment, checks the PR again (author, base,
# not a fork, not a draft, open, not queued yet) and switches auto-merge on with the owner's
# token. Once, when the PR opens (or reopens, or leaves draft): switching auto-merge off later
# sticks. To keep a PR out of the queue, open it as a draft.
name: Auto-queue

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [dev]

permissions:
  actions: write   # dispatch merge-queue.yml

jobs:
  enqueue:
    if: >-
      github.event.pull_request.user.login == github.repository_owner
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Ask the merge queue to queue this PR
        run: gh workflow run merge-queue.yml --repo "$GITHUB_REPOSITORY" --ref dev -f enqueue="$PR"
