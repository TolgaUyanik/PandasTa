# Runs the BASE branch's Gate E ledger check against the PR's tree.
#
# On `pull_request`, CI runs the PR's own copy of tests/test_gate_e_ledger.py, so a
# PR could add a waiver, re-pin the grandfather list, or deselect the test in the
# same change that needs it. `pull_request_target` takes this workflow from the
# base branch, and the job overwrites the guard files with the base's copies, so
# loosening the guard needs its own PR, merged first.
#
# Security: `pull_request_target` runs in the base repo's context, and this job
# executes the PR's code (pip install -e ., pandas_ta imports). The token is
# read-only, no secret is referenced, credentials are not persisted, and no
# Actions cache is restored or saved, so there is nothing to steal or poison.
# Keep it that way: never add secrets, write permissions or actions/cache here.
name: Gate E guard

on:
  pull_request_target:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the base branch's guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base
          persist-credentials: false
      - name: Use the base's guard files, not the PR's
        run: |
          cp _base/tests/test_gate_e_ledger.py tests/
          cp _base/docs/gate_e_ledger.py _base/docs/gate_e_grandfathered.json docs/
          rm -rf _base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<81" "pandas==2.3.3" "numpy==1.26.4" "scipy==1.13.0" \
                      "TA-Lib==0.7.1" "pytest==8.4.1"
          pip install -e .
      # --noconftest and an empty ini: a PR-added conftest.py or pytest config cannot
      # skip or deselect the base's checks.
      - name: Gate E ledger (base copy)
        run: python -m pytest -q --noconftest -c /dev/null --rootdir . -p no:cacheprovider tests/test_gate_e_ledger.py
